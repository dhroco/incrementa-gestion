        if (!rut.ok) return fail(422, 'RUT_INVALIDO', RUT_INVALIDO)
    reemplazar: |
        const rut = { ok: true, rut_body: '12345678', rut_dv: '5' }
    prueba: cd backend && node --test test/firmeSigningService.send.test.js --test-name-pattern="invalid RUT does not call Firme"
