    que: la restricción única parcial previene envíos duplicados al mismo contrato
    archivo: backend/migrations/202610220001_firme_signing.js
    buscar: |
      const ACTIVE_ATTEMPT_INDEX = `
        CREATE UNIQUE INDEX firme_signing_one_active_attempt
        ON firme_signing (draft_document_id)
        WHERE status IN ('sending', 'pending_signature')
      `
    reemplazar: |
      const ACTIVE_ATTEMPT_INDEX = `
        CREATE INDEX firme_signing_one_active_attempt
        ON firme_signing (draft_document_id)
        WHERE status IN ('sending', 'pending_signature')
      `
    prueba: cd backend && node --test test/firmeSigningService.send.test.js --test-name-pattern="a second active send is rejected"
    gravedad: grave

