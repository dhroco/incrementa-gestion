  - id: reconcile-check-draft
    que: reconcileAfterSendError solo borra documentos que siguen siendo DRAFT
    archivo: backend/services/firmeSigningService.js
    buscar: |
      async function reconcileAfterSendError(row) {
        let remote
        try {
          remote = await client.getDocument(row.firme_document_code)
        } catch (lookupErr) {
          logError(`no se pudo consultar el documento tras el fallo (${lookupErr.code || 'ERROR'})`)
          return { pending: true }
        }
        if (remote?.status === 'PENDING_SIGNATURE' || LATER.has(remote?.status)) {
          const adopted = await adoptSending(row, remote)
          return adopted ? { adopted: true } : { pending: true }
        }
        if (!remote?.status || remote.status === 'DRAFT') {
          try {
            await client.deleteDocument(row.firme_document_code)
          } catch (cleanupErr) {
            logError(`no se pudo borrar el documento tras el fallo (${cleanupErr.code || 'ERROR'})`)
          }
          return { failed: true }
        }
        return { pending: true }
      }
    reemplazar: |
      async function reconcileAfterSendError(row) {
        let remote
        try {
          remote = await client.getDocument(row.firme_document_code)
        } catch (lookupErr) {
          logError(`no se pudo consultar el documento tras el fallo (${lookupErr.code || 'ERROR'})`)
          return { pending: true }
        }
        if (remote?.status === 'PENDING_SIGNATURE' || LATER.has(remote?.status)) {
          const adopted = await adoptSending(row, remote)
          return adopted ? { adopted: true } : { pending: true }
        }
        try {
          await client.deleteDocument(row.firme_document_code)
        } catch (cleanupErr) {
          logError(`no se pudo borrar el documento tras el fallo (${cleanupErr.code || 'ERROR'})`)
        }
        return { failed: true }
      }
    prueba: cd backend && node --test test/firmeSigningService.revision.test.js --test-name-pattern="a failed send deletes only a document that is still a draft"
    gravedad: grave

