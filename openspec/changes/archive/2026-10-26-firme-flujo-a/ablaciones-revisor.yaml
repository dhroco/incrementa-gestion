  - id: recuperacion-intento-colgado
    que: los intentos sin código de documento no se recuperan
    archivo: backend/services/firmeSigningService.js
    buscar: |
      async function recoverHung(row) {
        if (!row.firme_document_code) {
          await markFailed(row.id, 'ENVIO_INTERRUMPIDO', 'El envío a firma se interrumpió antes de crear el documento.')
          return 'failed'
        }
    reemplazar: |
      async function recoverHung(row) {
        if (!row.firme_document_code) {
          return 'blocked'
        }
    prueba: cd backend && node --test test/firmeSigningService.send.test.js --test-name-pattern="a hung attempt without a code does not call Firme"
    gravedad: grave

  - id: validacion-email-firmante
    que: el email debe contener @ y un dominio para ser válido
    archivo: backend/services/firmeSigningService.js
    buscar: |
      function isEmail(value) {
        if (typeof value !== 'string' || /\s/.test(value)) return false
        const parts = value.split('@')
        if (parts.length !== 2) return false
        const [local, domain] = parts
        return Boolean(local && domain && domain.includes('.'))
      }
    reemplazar: |
      function isEmail(value) {
        return typeof value === 'string' && value.trim().length > 0
      }
    prueba: cd backend && node --test test/firmeSigningService.send.test.js --test-name-pattern="incomplete signee names the correo field"
    gravedad: borde

