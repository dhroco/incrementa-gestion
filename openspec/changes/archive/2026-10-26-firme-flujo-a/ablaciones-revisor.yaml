  - id: adopcion-intento-colgado
    que: adoptSending recupera intentos en 'sending' cuando el documento ya está PENDING en Firme
    archivo: backend/services/firmeSigningService.js
    buscar: |
      async function adoptSending(row, remote) {
        let adopted = false
        await db.transaction(async (trx) => {
          const locked = await trx('firme_signing')
            .where({ id: row.id, status: 'sending' })
            .forUpdate()
            .skipLocked()
            .first()
          if (!locked) return
          await trx('firme_signing').where({ id: row.id, status: 'sending' }).update({
            status: 'pending_signature',
            firme_status: remote?.status || null,
            updated_at: clock()
          })
          await trx('draft_document').where({ id: row.draft_document_id }).update({ status: 'in_signature' })
          adopted = true
        })
        return adopted
      }
    reemplazar: |
      async function adoptSending(row, remote) {
        let adopted = false
        await db.transaction(async (trx) => {
          const locked = await trx('firme_signing')
            .where({ id: row.id, status: 'sending' })
            .forUpdate()
            .skipLocked()
            .first()
          if (!locked) return
          await trx('firme_signing').where({ id: row.id, status: 'sending' }).update({
            status: 'send_failed',
            firme_status: remote?.status || null,
            updated_at: clock()
          })
          await trx('draft_document').where({ id: row.draft_document_id }).update({ status: 'draft' })
          adopted = false
        })
        return adopted
      }
    prueba: cd backend && node --test test/firmeSigningService.revision.test.js --test-name-pattern="a failed send adopts a document that is already pending signature"
    gravedad: grave

  - id: evidencia-idempotente
    que: sameEvidence permite reintentos de almacenamiento con la misma evidencia
    archivo: backend/services/firmeSigningService.js
    buscar: |
      function sameEvidence(stored, incoming) {
        try {
          const left = JSON.parse(Buffer.isBuffer(stored) ? stored.toString('utf8') : String(stored))
          const right = JSON.parse(Buffer.isBuffer(incoming) ? incoming.toString('utf8') : String(incoming))
          return stableJson(evidenceCore(left)) === stableJson(evidenceCore(right))
        } catch {
          return false
        }
      }
    reemplazar: |
      function sameEvidence(stored, incoming) {
        return false
      }
    prueba: cd backend && node --test test/firmeSigningService.revision.test.js --test-name-pattern="a retry after the evidence upload survives a different clock"
    gravedad: grave

  - id: bloqueo-transaccion-pending
    que: lockPending previene condiciones de carrera en refresh simultáneos
    archivo: backend/services/firmeSigningService.js
    buscar: |
      async function lockPending(signingId) {
        let locked = null
        await db.transaction(async (trx) => {
          const row = await trx('firme_signing')
            .where({ id: signingId, status: 'pending_signature' })
            .forUpdate()
            .skipLocked()
            .first()
          if (row) locked = { ...row }
        })
        return locked
      }
    reemplazar: |
      async function lockPending(signingId) {
        let locked = null
        await db.transaction(async (trx) => {
          const row = await trx('firme_signing')
            .where({ id: signingId, status: 'pending_signature' })
            .first()
          if (row) locked = { ...row }
        })
        return locked
      }
    prueba: cd backend && npm test 2>&1 | grep -q "a retry after the evidence upload"
    gravedad: grave

  - id: separacion-preparacion-commit
    que: commitSigned hace commit transaccional después de preparar la firma
    archivo: backend/services/firmeSigningService.js
    buscar: |
      async function commitSigned(attempt, prepared) {
        let wrote = false
        await db.transaction(async (trx) => {
          const still = await trx('firme_signing')
            .where({ id: attempt.id, status: 'pending_signature' })
            .forUpdate()
            .skipLocked()
            .first()
          if (!still) return
          const draft = prepared.draft
          const existing = await trx('document').where({ id: attempt.document_id }).first()
          if (!existing) {
            const overrides = draft.contract_overrides && typeof draft.contract_overrides === 'object'
              ? draft.contract_overrides
              : null
            await trx('document').insert({
              id: attempt.document_id,
              draft_document_id: draft.id,
              supplier_id: draft.supplier_id,
              company_id: draft.company_id,
              template_id: draft.template_id,
              client_id: draft.client_id ?? null,
              contract_overrides: overrides,
              gcs_path: prepared.gcsPath,
              file_name: prepared.fileName,
              source: 'generated',
              signed_at: prepared.signedAt,
              signed_by: signeeFullName(attempt),
              uploaded_by: attempt.approved_by,
              draft_sha256: prepared.originalSha,
              signed_sha256: prepared.signedSha
            })
          }
          await trx('firme_signing').where({ id: attempt.id, status: 'pending_signature' }).update({
            status: 'signed',
            verified_at: prepared.verifiedAt,
            signed_gcs_path: prepared.gcsPath,
            evidence_gcs_path: prepared.evidencePath,
            signed_sha256: prepared.signedSha,
            firme_status: prepared.firmeStatus,
            signee_signed_on: prepared.signeeSignedOn,
            last_checked_at: clock(),
            updated_at: clock()
          })
          await trx('draft_document').where({ id: draft.id }).update({ status: 'signed' })
          wrote = true
        })
        return wrote
      }
    reemplazar: |
      async function commitSigned(attempt, prepared) {
        await db('firme_signing').where({ id: attempt.id }).update({
          status: 'signed',
          verified_at: prepared.verifiedAt,
          signed_gcs_path: prepared.gcsPath,
          evidence_gcs_path: prepared.evidencePath,
          signed_sha256: prepared.signedSha,
          firme_status: prepared.firmeStatus,
          signee_signed_on: prepared.signeeSignedOn,
          last_checked_at: clock(),
          updated_at: clock()
        })
        return true
      }
    prueba: cd backend && node --test test/firmeSigningService.revision.test.js --test-name-pattern="a retry after the evidence upload"
    gravedad: grave

