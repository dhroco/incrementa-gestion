name: Deploy Prod (Azure)

# Push a `prod` → espera la aprobación de David → imagen del backend al ACR de prod → backend →
# frontend a Static Web Apps. Prod no tiene MCP (el MCP HTTP abierto no arranca con
# ENVIRONMENT=prod).
#
# Corre en el environment de GitHub `produccion`:
#   - exige la aprobación de David antes de empezar;
#   - solo acepta la rama `prod`;
#   - guarda las variables de Azure de prod (tenant y suscripción de Incrementa), que pisan a
#     las del repo, que son las de pre-prod.
# Entra a Azure con OIDC federado (identidad id-incrementa-github-deploy-prod, que solo acepta
# tokens del environment `produccion`): no hay ninguna clave guardada en GitHub.
#
# Un cambio llega aquí solo por PR de `preprod` a `prod`: lo que no pasó por pre-prod no llega
# a producción. La infraestructura (Bicep) se cambia aparte, a mano, con what-if antes.
#
# Requisito: las Container Apps tienen que estar configuradas con el Bicep en modo
# secretosCargados=true. Este workflow solo cambia la imagen y el contenido.

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-azure-prod
  cancel-in-progress: false

env:
  RG: rg-incrementa-gestion-prod
  ACR: acrincrementaprod
  ACR_SERVER: acrincrementaprod.azurecr.io
  BACKEND_APP: ca-incrementa-backend
  SWA: swa-incrementa-prod
  NODE_VERSION: '22'
  # App registration del login de prod (incrementa-gestion, tenant de Incrementa). No es secreto.
  LOGIN_CLIENT_ID: 9976f99a-975a-4f33-8dd8-746a2411adad
  # Suscripción de Incrementa: el workflow se niega a seguir si entró a otra.
  SUSCRIPCION_PROD: 2fdd7c0a-664d-46ea-863d-73f96627f217

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Solo desde la rama prod
        if: github.ref != 'refs/heads/prod'
        run: |
          echo "::error::Prod se despliega solo desde la rama prod (esto es $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v4

      - name: Entrar a Azure (OIDC, sin claves)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # La identidad de deploy solo tiene permisos sobre el ACR, el backend y la SWA (no puede
      # leer el resource group), así que se comprueba la suscripción con la que entró.
      - name: Confirmar que es la suscripción de prod
        run: |
          ACTUAL="$(az account show --query id -o tsv)"
          if [ "$ACTUAL" != "$SUSCRIPCION_PROD" ]; then
            echo "::error::Entró a la suscripción $ACTUAL y no a la de prod ($SUSCRIPCION_PROD)."
            exit 1
          fi
          echo "Suscripción de prod: $(az account show --query name -o tsv) ($ACTUAL)"

      # --- Backend ---
      - name: Construir y publicar la imagen del backend
        run: |
          az acr login --name "$ACR"
          IMAGEN="$ACR_SERVER/backend:${GITHUB_SHA}"
          docker build -t "$IMAGEN" -t "$ACR_SERVER/backend:prod" ./backend
          docker push "$IMAGEN"
          docker push "$ACR_SERVER/backend:prod"
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"

      - name: Actualizar el backend
        run: az containerapp update -g "$RG" -n "$BACKEND_APP" --image "$IMAGEN" --output none

      - name: Comprobar que el backend responde
        run: |
          FQDN="$(az containerapp show -g "$RG" -n "$BACKEND_APP" --query properties.configuration.ingress.fqdn -o tsv)"
          echo "BACKEND_URL=https://$FQDN" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS "https://$FQDN/health" > /dev/null; then
              echo "Backend en línea: https://$FQDN"
              exit 0
            fi
            sleep 10
          done
          echo "::error::El backend no respondió /health en 5 minutos."
          exit 1

      # --- Frontend ---
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Compilar el frontend
        working-directory: frontend
        env:
          ENVIRONMENT: prod
          VITE_API_BASE_URL: ${{ env.BACKEND_URL }}
          VITE_AZURE_CLIENT_ID: ${{ env.LOGIN_CLIENT_ID }}
          VITE_AZURE_AUTHORITY: https://login.microsoftonline.com/${{ vars.AZURE_TENANT_ID }}
          VITE_AZURE_API_SCOPE: api://${{ env.LOGIN_CLIENT_ID }}/access_as_user
        run: |
          npm ci
          npm run build

      - name: Pedir el token de despliegue de Static Web Apps
        run: |
          TOKEN="$(az staticwebapp secrets list -g "$RG" -n "$SWA" --query properties.apiKey -o tsv)"
          echo "::add-mask::$TOKEN"
          echo "SWA_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Publicar el frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true

      - name: Resumen
        run: |
          echo "Imagen:   $IMAGEN"
          echo "Backend:  $BACKEND_URL"
          echo "Frontend: https://$(az staticwebapp show -g "$RG" -n "$SWA" --query defaultHostname -o tsv)"
