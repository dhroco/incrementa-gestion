version: 1
dominio: moneda-plantilla
diseno: docs/disenos/moneda-plantilla.md
recortes:
  - id: moneda-plantilla-usd
    objetivo: >
      Que la plantilla tenga moneda (currency_code, CLP o USD), que precio_numero se escriba según
      esa moneda (US$1,290 en USD, igual que hoy en CLP) y que la cláusula 3.1 de CONTRATO_0016 y
      CONTRATO_0017 deje de imprimir «(Tipo de moneda País)» y diga la moneda en palabras.
    depende_de: []
    fuera: >
      Decimales, entrada con coma de miles, elegir la moneda desde la interfaz, otras monedas,
      contratos ya generados y las plantillas chilenas.
    por_que_este_tamano: >
      Una migración (columna y texto de dos plantillas, con respaldo) y un cambio acotado en
      documentBuilderService: cargar la plantilla antes de formatear el precio. Sin cambios de API
      ni de frontend.
  - id: precio-entero-estricto
    objetivo: >
      Que el precio del contrato (precio_numero) solo se acepte como entero limpio (1290, o agrupado
      de a tres con un solo separador: 1.290 o 1,290) y que cualquier otra entrada se rechace con un
      mensaje en español en vez de truncarse sin avisar.
    depende_de: [moneda-plantilla-usd]
    fuera: >
      Decimales o centavos, otros campos numéricos (cantidad_reels, duracion_ejecucion,
      dias_cesion), el frontend, el MCP y los contratos ya generados.
    por_que_este_tamano: >
      Una función pura de parseo y una validación en generateAndPersist, antes de preprocesar. No
      toca el modelo de datos, la API ni la interfaz; el error sale por el mismo camino que los de
      validación de hoy.
